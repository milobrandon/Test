<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay Systems</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login / Setup Screen -->
    <div class="auth-screen" id="auth-screen">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-icon" style="width:48px;height:48px;font-size:22px;margin:0 auto 12px;">R</div>
                <h1>Relay Systems</h1>
                <p id="auth-subtitle">Voice AI Management Platform</p>
            </div>
            <div id="auth-form-container"></div>
        </div>
    </div>

    <!-- Main App (shown after login) -->
    <div class="app" id="app" style="display:none">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">R</div>
                <div class="brand-text">
                    <strong>Relay Systems</strong>
                    <span id="sidebar-role-label">Admin Dashboard</span>
                </div>
            </div>
            <ul class="nav-menu" id="nav-menu"></ul>
            <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);">
                <div style="font-size:12px;color:var(--sidebar-text);margin-bottom:6px;" id="user-label"></div>
                <button class="btn btn-sm btn-secondary" style="width:100%;justify-content:center;" onclick="logout()">Sign Out</button>
            </div>
        </nav>

        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <h1 id="page-title">Dashboard</h1>
                    <div class="breadcrumb" id="breadcrumb"></div>
                </div>
                <div class="topbar-actions" id="topbar-actions"></div>
            </header>
            <div class="content" id="content"></div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-container">
            <div class="modal-header">
                <h2 id="modal-title">Modal</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
